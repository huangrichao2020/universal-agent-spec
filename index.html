<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Agent Spec</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.3.4/vue.global.prod.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* ── APPLE-STYLE DESIGN SYSTEM ── */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;700;900&display=swap');

  :root {
    --bg:          #f5f5f7;
    --bg2:         rgba(255,255,255,0.72);
    --bg3:         rgba(255,255,255,0.5);
    --surface:     #ffffff;
    --border:      rgba(0,0,0,0.12);
    --border2:     rgba(0,0,0,0.20);
    --blue:        #0071e3;
    --blue-light:  rgba(0,113,227,0.08);
    --blue-mid:    rgba(0,113,227,0.15);
    --amber:       #f59e0b;
    --amber-light: rgba(245,158,11,0.08);
    --green:       #34c759;
    --red:         #ff3b30;
    --purple:      #7c3aed;
    --text:        #1d1d1f;
    --text2:       #424245;
    --text3:       #6e6e73;
    --text4:       #a1a1a6;
    --shadow-sm:   0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:   0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
    --shadow-lg:   0 8px 32px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06);
    --radius:      14px;
    --radius-sm:   8px;
    --blur:        saturate(180%) blur(20px);
    --mono:        'JetBrains Mono', 'SF Mono', monospace;
    --sans:        'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    --serif:       'Noto Serif SC', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* subtle dot grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, rgba(0,0,0,0.06) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
    z-index: 0;
  }

  #app { position: relative; z-index: 1; }

  /* ── HEADER ── */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    background: rgba(245,245,247,0.82);
    border-bottom: 1px solid var(--border);
    padding: 18px 48px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .header-title {
    font-family: var(--sans);
    font-size: clamp(18px, 2.5vw, 26px);
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.03em;
    line-height: 1.1;
  }

  .header-title span { color: var(--blue); }

  .header-sub {
    font-size: 11px;
    color: var(--text3);
    margin-top: 3px;
    letter-spacing: 0.02em;
    font-family: var(--mono);
  }

  .header-badge {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--blue);
    background: var(--blue-light);
    border: 1px solid rgba(0,113,227,0.18);
    padding: 5px 12px;
    border-radius: 20px;
    white-space: nowrap;
    font-family: var(--sans);
  }

  /* ── LANG TOGGLE ── */
  .lang-toggle {
    display: flex;
    gap: 3px;
    align-items: center;
    background: var(--border);
    border-radius: 10px;
    padding: 3px;
  }

  .lang-btn {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    padding: 5px 14px;
    border-radius: 8px;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--text3);
    transition: all 0.2s;
    white-space: nowrap;
  }

  .lang-btn:hover { color: var(--text); }

  .lang-btn.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow-sm);
  }

  /* ── LAYOUT ── */
  .layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: calc(100vh - 65px);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    border-right: 1px solid var(--border);
    padding: 24px 0;
    position: sticky;
    top: 65px;
    height: calc(100vh - 65px);
    overflow-y: auto;
    background: rgba(245,245,247,0.6);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
  }

  .sidebar::-webkit-scrollbar { width: 3px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .sidebar-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--text4);
    text-transform: uppercase;
    padding: 0 18px 12px;
    font-family: var(--sans);
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    cursor: pointer;
    transition: all 0.15s;
    border-left: 2px solid transparent;
    font-size: 12px;
    font-weight: 400;
    color: var(--text3);
    font-family: var(--sans);
    border-radius: 0;
  }

  .nav-item:hover {
    color: var(--text);
    background: rgba(0,113,227,0.05);
  }

  .nav-item.active {
    color: var(--blue);
    border-left-color: var(--blue);
    background: var(--blue-light);
    font-weight: 500;
  }

  .nav-num { font-size: 10px; width: 18px; flex-shrink: 0; opacity: 0.45; font-family: var(--mono); }
  .nav-item.active .nav-num { opacity: 1; }

  /* ── MAIN ── */
  .main {
    padding: 40px 48px;
    max-width: 920px;
  }

  /* ── CONCEPT CARD ── */
  .concept-card {
    background: var(--surface);
    border-radius: var(--radius);
    margin-bottom: 28px;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border);
    overflow: hidden;
    transition: box-shadow 0.2s, transform 0.2s;
  }

  .concept-card:hover {
    box-shadow: var(--shadow-lg);
    transform: translateY(-1px);
  }

  .card-header {
    padding: 24px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 16px;
    background: linear-gradient(135deg, #fafafa 0%, #ffffff 100%);
  }

  .card-num {
    font-size: 40px;
    font-weight: 700;
    color: rgba(0,0,0,0.08);
    line-height: 1;
    flex-shrink: 0;
    font-family: var(--sans);
    letter-spacing: -0.03em;
  }

  .card-title-wrap { flex: 1; }

  .card-title {
    font-family: var(--sans);
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 3px;
    letter-spacing: -0.02em;
  }

  .card-title .accent { color: var(--blue); }

  .card-subtitle {
    font-size: 12px;
    color: var(--text3);
    font-family: var(--mono);
  }

  .card-tag {
    font-size: 10px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.05em;
    flex-shrink: 0;
    align-self: flex-start;
    margin-top: 2px;
    text-transform: uppercase;
    font-family: var(--sans);
  }

  .tag-infra   { background: rgba(124,58,237,0.08); color: var(--purple); border: 1px solid rgba(124,58,237,0.15); }
  .tag-core    { background: var(--blue-light); color: var(--blue); border: 1px solid rgba(0,113,227,0.15); }
  .tag-system  { background: var(--amber-light); color: var(--amber); border: 1px solid rgba(245,158,11,0.2); }
  .tag-pattern { background: rgba(52,199,89,0.08); color: #1a8a3a; border: 1px solid rgba(52,199,89,0.2); }
  .tag-biz     { background: rgba(255,59,48,0.07); color: var(--red); border: 1px solid rgba(255,59,48,0.15); }

  .card-body { padding: 28px; }

  /* ── DIAGRAM ── */
  .diagram-wrap {
    background: #f4f4f8;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px 12px;
    margin-bottom: 24px;
    overflow: visible;
  }

  .diagram-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }

  /* ── DEFINITION BLOCK ── */
  .def-block {
    border-left: 3px solid var(--blue);
    padding: 14px 18px;
    background: var(--blue-light);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    margin-bottom: 20px;
  }

  .def-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--blue);
    text-transform: uppercase;
    margin-bottom: 6px;
    font-family: var(--sans);
  }

  .def-text {
    font-size: 15px;
    line-height: 1.8;
    color: var(--text);
    font-family: var(--sans);
  }

  .def-text strong { color: var(--blue); font-weight: 600; }

  /* ── SECTIONS ── */
  .section { margin-bottom: 20px; }

  .section-title {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--sans);
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .prose {
    font-size: 15px;
    line-height: 1.9;
    color: var(--text2);
    font-family: var(--sans);
  }

  .prose strong { color: var(--text); font-weight: 600; }
  .prose em {
    color: var(--blue);
    font-style: normal;
    border-bottom: 1px dashed rgba(0,113,227,0.35);
  }

  /* ── CODE BLOCK ── */
  .code-block {
    background: #1c1c1e;
    border-radius: var(--radius-sm);
    padding: 16px 20px;
    font-size: 12px;
    line-height: 1.75;
    overflow-x: auto;
    margin: 14px 0;
    white-space: pre;
    color: #e2e8f0;
    font-family: var(--mono);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .code-block .kw  { color: #ff79c6; }
  .code-block .str { color: #f1fa8c; }
  .code-block .cmt { color: #6272a4; }
  .code-block .fn  { color: #50fa7b; }

  /* ── TABLE ── */
  .compare-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    margin: 12px 0;
    font-family: var(--sans);
  }

  .compare-table th {
    background: #f5f5f7;
    color: var(--text3);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border2);
  }

  .compare-table td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text2);
    vertical-align: top;
    line-height: 1.5;
  }

  .compare-table tr:last-child td { border-bottom: none; }
  .compare-table tr:hover td { background: rgba(0,113,227,0.03); }

  /* ── INSIGHT BOX ── */
  .insight {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.18);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin: 14px 0;
    font-size: 14px;
    line-height: 1.75;
    color: var(--text2);
    font-family: var(--sans);
  }

  .insight strong { color: var(--text); }
  .insight-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }

  /* ── INSTRUCTION CARDS ── */
  .instruction-card {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: #fafafa;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px 18px;
    margin-bottom: 10px;
    transition: box-shadow 0.15s, background 0.15s;
  }

  .instruction-card:hover {
    background: var(--surface);
    box-shadow: var(--shadow-sm);
  }

  .instruction-icon { font-size: 20px; flex-shrink: 0; width: 32px; text-align: center; margin-top: 1px; }

  .instruction-body { flex: 1; }

  .instruction-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 5px;
    font-family: var(--sans);
  }

  .instruction-text {
    font-size: 13px;
    line-height: 1.85;
    color: var(--text2);
    font-family: var(--sans);
  }

  /* ── LOADING STATE ── */
  .loading-state {
    display: flex; align-items: center; justify-content: center;
    height: 60vh; flex-direction: column; gap: 16px;
    color: var(--text3); font-size: 13px; font-family: var(--sans);
  }

  .loading-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--blue); display: inline-block;
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50%       { opacity: 1;   transform: scale(1.2); }
  }

  /* ── FOOTER ── */
  .footer {
    border-top: 1px solid var(--border);
    padding: 20px 48px;
    font-size: 12px;
    color: var(--text4);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(245,245,247,0.8);
    font-family: var(--sans);
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .main { padding: 24px 20px; }
    .header { padding: 14px 20px; flex-wrap: wrap; }
  }
</style>

<!-- ── INLINE: registry.js ── -->
<script>
(function () {
  const chapters = [];
  const registered = new Set();
  const AgentSpec = {
    register(chapter) {
      if (registered.has(chapter.id)) { console.warn('[AgentSpec] Duplicate id:', chapter.id); return; }
      chapters.push(chapter);
      registered.add(chapter.id);
    },
    getChapters() { return [...chapters].sort((a, b) => a.order - b.order); },
    t(field, lang) {
      if (typeof field === 'string') return field;
      return field[lang] || field['en'] || '';
    },
    LANGS: ['en', 'zh'],
    LANG_NAMES: { en: 'EN', zh: '中文' }
  };
  window.AgentSpec = AgentSpec;
})();
</script>

<!-- ── INLINE: helpers.js ── -->
<script>
(function () {
  const H = {
    box(x, y, w, h, col, text, sub = '', rx = 6) {
      const textY = sub ? y + h / 2 - 7 : y + h / 2 + 5;
      return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${col}18" stroke="${col}" stroke-width="1.5"/>
        <text x="${x+w/2}" y="${textY}" text-anchor="middle" fill="${col}" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="500">${text}</text>
        ${sub ? `<text x="${x+w/2}" y="${y+h/2+11}" text-anchor="middle" fill="${col}99" font-family="'JetBrains Mono',monospace" font-size="12">${sub}</text>` : ''}`;
    },
    label(x, y, text, col = '#6b84a8', size = 11) {
      return `<text x="${x}" y="${y}" text-anchor="middle" fill="${col}" font-family="'JetBrains Mono',monospace" font-size="${size}">${text}</text>`;
    },
    arrow(x1, y1, x2, y2, col = '#6b84a8', label = '', markerId = 'arr') {
      const dx = x2-x1, dy = y2-y1, len = Math.sqrt(dx*dx+dy*dy);
      const nx = dx/len, ny = dy/len;
      const ax = x2-nx*10, ay = y2-ny*10;
      const lx = (x1+x2)/2, ly = (y1+y2)/2;
      return `<line x1="${x1}" y1="${y1}" x2="${ax}" y2="${ay}" stroke="${col}" stroke-width="1.5" marker-end="url(#${markerId})"/>
        ${label ? `<text x="${lx}" y="${ly-6}" text-anchor="middle" fill="${col}" font-family="'JetBrains Mono',monospace" font-size="12">${label}</text>` : ''}`;
    },
    dashed(x1, y1, x2, y2, col = '#2a4578') {
      return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="1.2" stroke-dasharray="4 3"/>`;
    },
    c: { cyan:'#0071e3', amber:'#f59e0b', green:'#34c759', red:'#ff3b30', purple:'#7c3aed',
         dim:'#e5e5ea', dim2:'#d1d1d6', bg:'#f5f5f7', bg2:'#ffffff', text:'#1d1d1f', textDim:'#6e6e73' }
  };
  window.AgentSpecHelpers = H;
})();
</script>

<!-- ── INLINE: 00-llm-api/chapter.js ── -->
<script>
(function () {
  const S = window.AgentSpecHelpers;
  const t = (lang, en, zh) => lang === 'zh' ? zh : en;

  window.AgentSpec.register({
    id: '00-llm-api',
    order: 0,

    nav:      { en: 'LLM API',      zh: '大模型 API' },
    title:    { en: 'LLM <span class="accent">API</span>', zh: '大模型 <span class="accent">API</span>' },
    subtitle: { en: 'Infrastructure Layer · Stateless Function', zh: 'Large Language Model API · 基础设施层' },
    tag:      { en: 'Infrastructure', zh: '基础设施' },
    tagClass: 'tag-infra',

    viewBox: '0 0 760 210',

    getSvg(lang) {
      return `
        <ellipse cx="380" cy="85" rx="130" ry="52"
          fill="#7c3aed28" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3"/>
        <text x="380" y="80" text-anchor="middle" fill="#7c3aed"
          font-family="'JetBrains Mono',monospace" font-size="14" font-weight="500">
          ${t(lang, 'LLM API', '大模型 API')}
        </text>
        <text x="380" y="100" text-anchor="middle" fill="#7c3aed88"
          font-family="'JetBrains Mono',monospace" font-size="12">
          ${t(lang, 'Stateless · Each call independent', '无状态 · 每次独立')}
        </text>

        ${S.box(55, 148, 130, 42, '#00c8ff', t(lang, 'Your App', '你的程序'))}
        ${S.box(315, 148, 90, 42, '#ffb800', 'curl', '')}
        ${S.box(575, 148, 130, 42, '#00e599', t(lang, 'Any Client', '任何客户端'))}

        <line x1="120" y1="148" x2="330" y2="110"
          stroke="#0071e3" stroke-width="1.5" marker-end="url(#arrC)"/>
        <line x1="360" y1="148" x2="368" y2="112"
          stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrA)"/>
        <line x1="640" y1="148" x2="450" y2="110"
          stroke="#34c759" stroke-width="1.5" marker-end="url(#arr)"/>

        ${S.label(380, 205,
          t(lang, 'POST /v1/messages → Input → Process → Output → Each call is independent',
                  'POST /v1/messages → 输入→处理→输出 → 每次调用完全独立'),
          '#6b84a8', 11)}
      `;
    },

    content: {
      en: {
        definition: 'An HTTP endpoint exposed by LLM providers (OpenAI, Anthropic, Alibaba Cloud, etc.) that accepts text input and returns text output. <strong>It is a stateless function</strong> — it has no memory of you; every call starts from zero.',
        essence: 'Many people think "integrating the GPT API" gives them an AI assistant. In reality, they are just making a memoryless phone call each time. <em>The model itself has no memory, no state, no will.</em> It is an extraordinarily complex "text continuation function." The entire purpose of Agent architecture is to build <strong>continuity, specialization, and executability</strong> on top of this stateless function.',
        insight: 'Statelessness is a deliberate design choice for LLM APIs, not a flaw. It enables millions of concurrent requests. The Agent layer solves the "stateful" problem.',
        table: {
          title: 'LLM API vs Traditional API',
          headers: ['Dimension', 'Traditional API', 'LLM API'],
          rows: [
            ['Input', 'Structured parameters', 'Natural language text'],
            ['Output', 'Deterministic result', 'Probabilistic generated text'],
            ['State', 'Optional', '<strong>Always stateless</strong>'],
            ['Cost model', 'Per call', 'Per token'],
          ]
        }
      },
      zh: {
        definition: '大模型厂商（OpenAI / Anthropic / 阿里云等）暴露的 HTTP 接口。接收文本输入，返回文本输出。<strong>本质是一个无状态函数</strong>——不记得你，每次调用都从零开始。',
        essence: '很多人以为"接入了 GPT API"就拥有了一个 AI 助手，其实只是每次打了一个无记忆的电话。<em>大模型本身没有记忆、没有状态、没有意志</em>。它只是一个极其复杂的"文字续写函数"。Agent 架构的全部意义，就是在这个无状态函数之外，构建出<strong>持续性、专业性、可执行性</strong>。',

        </text>
        ${tocRows}
        <text x="568" y="175" text-anchor="middle" fill="#f59e0b"
          font-family="'JetBrains Mono',monospace" font-size="12">
          ${t(lang, 'Subscription / usage · You pay compute', '订阅 / 按量 · 你承担算力成本')}
        </text>
        <text x="568" y="193" text-anchor="middle" fill="#34c75988"
          font-family="'JetBrains Mono',monospace" font-size="12">
          ${t(lang, 'Moat: product UX + user habit', '护城河：产品体验 + 用户习惯')}
        </text>
        <text x="568" y="246" text-anchor="middle" fill="#48484a"
          font-family="'JetBrains Mono',monospace" font-size="12">
          ${t(lang, 'Best for: consumer-facing AI products', '适合：面向消费者的 AI 产品')}
        </text>
      `;
    },

    content: {
      en: {
        definition: 'Two business routes: <strong>ToB</strong> — sell the Agent itself (shell + memory files), one-time purchase, user brings their own compute; <strong>ToC</strong> — sell product service, Agent runs on your server, users pay for usage.',
        essence: 'The core difference is <em>who bears compute cost</em> and <em>where the moat comes from</em>.\n\nToB moat: <strong>Domain memory.</strong> An Agent with accumulated expertise in medicine, law, finance — expertise a buyer cannot quickly replicate — is truly valuable.\n\nToC moat: <strong>Product UX + user habit.</strong> Compute cost is your burden, but scale effects and user stickiness are your barriers.\n\nNote: ToB is not "selling a Prompt collection." The real value is the <em>domain memory files</em> — the professionally validated knowledge base built from extensive practice.',
        insight: 'In the Agent era, ToB business sells not software features but "a copy of an expert\'s brain." Selling a top-tier sales Agent\'s memory to 100 companies is more scalable than training 100 salespeople.'
      },
      zh: {
        definition: '两条商业路线：<strong>ToB</strong>——你是卖家，卖 Agent 本体（UI 界面 + 记忆文件），一次性买断，买家自己接入算力大模型使用 Agent；<strong>ToC</strong>——卖产品服务，Agent 在你的服务器，算力和大模型也用你自己的，用户充值使用。',
        essence: '两条路线的核心差异是<em>谁承担算力成本</em>和<em>护城河来自哪里</em>。\n\nToB 的护城河：<strong>行业记忆</strong>。一个在医疗、法律、金融等垂直领域积累了大量专业记忆的 Agent，其价值是买家无法自己快速复制的。\n\nToC 的护城河：<strong>产品体验 + 用户习惯</strong>。算力成本是你的负担，但规模效应和用户粘性是壁垒。\n\n注意：ToB 不是"卖 Prompt 合集"，真正的价值在于<em>行业记忆文件</em>——那些经过大量实践验证、积累的专业知识库。',
        insight: 'Agent 时代的 ToB 生意，卖的不是软件功能，卖的是"专家大脑的副本"。把一个顶级销售 Agent 的记忆卖给 100 个公司，比培养 100 个销售更可扩展。'
      }
    }
  });
})();

</script>


</head>
<body>

<!-- Global SVG marker defs -->
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <marker id="arr"  markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#48484a"/></marker>
    <marker id="arrC" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0071e3"/></marker>
    <marker id="arrA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/></marker>
  </defs>
</svg>

<div id="app">
  <!-- LOADING -->
  <div v-if="loading" class="loading-state">
    <span class="loading-dot"></span>
    <span>{{ lang === 'zh' ? '加载章节中...' : 'Loading chapters...' }}</span>
  </div>

  <template v-else>
    <!-- HEADER -->
    <header class="header">
      <div>
        <div class="header-title">
          <template v-if="lang === 'zh'">通用 <span>Agent</span> 定义规范</template>
          <template v-else>Universal <span>Agent</span> Spec</template>
        </div>
        <div class="header-sub">
          <template v-if="lang === 'zh'">Universal Agent Definition Specification · v2.0 · 工程实践向</template>
          <template v-else>Universal Agent Definition Specification · v2.0 · Engineering Reference</template>
        </div>
      </div>

      <!-- BADGE + LANG TOGGLE grouped together -->
      <div style="display:flex;align-items:center;gap:10px;margin-left:auto;">
        <span class="header-badge">{{ chapters.length }} {{ lang === 'zh' ? '核心概念' : 'Concepts' }}</span>
        <div class="lang-toggle" style="margin-left:0">
          <button
            v-for="l in LANGS" :key="l"
            class="lang-btn"
            :class="{ active: lang === l }"
            @click="setLang(l)"
          >{{ LANG_NAMES[l] }}</button>
        </div>
      </div>
    </header>

    <div class="layout">
      <!-- SIDEBAR -->
      <nav class="sidebar">
        <div class="sidebar-label">{{ lang === 'zh' ? '概念导航' : 'Contents' }}</div>
        <div
          v-for="(c, i) in chapters"
          :key="c.id"
          class="nav-item"
          :class="{ active: activeIdx === i }"
          @click="scrollTo(i)"
        >
          <span class="nav-num">{{ String(c.order).padStart(2, '0') }}</span>
          <span>{{ t(c.nav) }}</span>
        </div>
      </nav>

      <!-- MAIN -->
      <main class="main" ref="mainEl" @scroll="onScroll">
        <div
          v-for="(c, i) in chapters"
          :key="c.id"
          :ref="el => cardRefs[i] = el"
          class="concept-card"
        >
          <!-- CARD HEADER -->
          <div class="card-header">
            <div class="card-num">{{ String(c.order).padStart(2, '0') }}</div>
            <div class="card-title-wrap">
              <div class="card-title" v-html="t(c.title)"></div>
              <div class="card-subtitle">{{ t(c.subtitle) }}</div>
            </div>
            <span class="card-tag" :class="c.tagClass">{{ t(c.tag) }}</span>
          </div>

          <!-- CARD BODY -->
          <div class="card-body">
            <!-- SVG DIAGRAM -->
            <div class="diagram-wrap" v-if="c.getSvg" v-html="buildSvg(c)"></div>

            <!-- DEFINITION -->
            <div class="def-block" v-if="content(c).definition">
              <div class="def-label">{{ lang === 'zh' ? '核心定义' : 'Definition' }}</div>
              <div class="def-text" v-html="content(c).definition"></div>
            </div>

            <!-- ESSENCE -->
            <div class="section" v-if="content(c).essence">
              <div class="section-title">{{ lang === 'zh' ? '本质解析' : 'Essence' }}</div>
              <div class="prose" v-html="content(c).essence"></div>
            </div>

            <!-- INSIGHT -->
            <div class="insight" v-if="content(c).insight">
              <span class="insight-icon">⚡</span>
              <span v-html="content(c).insight"></span>
            </div>

            <!-- CODE -->
            <div v-if="content(c).code" class="code-block" v-html="content(c).code"></div>

            <!-- TABLE -->
            <div v-if="content(c).table" class="section">
              <div class="section-title">{{ content(c).table.title }}</div>
              <table class="compare-table">
                <thead>
                  <tr><th v-for="h in content(c).table.headers" :key="h">{{ h }}</th></tr>
                </thead>
                <tbody>
                  <tr v-for="(row, ri) in content(c).table.rows" :key="ri">
                    <td v-for="(cell, ci) in row" :key="ci" v-html="cell"></td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- TOKEN SAVING TABLE -->
            <div v-if="content(c).tokenSaving" class="section">
              <div class="section-title">{{ content(c).tokenSaving.title }}</div>
              <table class="compare-table">
                <thead>
                  <tr><th v-for="h in content(c).tokenSaving.headers" :key="h">{{ h }}</th></tr>
                </thead>
                <tbody>
                  <tr v-for="(row, ri) in content(c).tokenSaving.rows" :key="ri">
                    <td v-for="(cell, ci) in row" :key="ci" v-html="cell"></td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- INSTRUCTIONS -->
            <div v-if="content(c).instructions" class="section">
              <div class="section-title">{{ content(c).instructions.title }}</div>
              <p class="prose" style="margin-bottom:16px" v-html="content(c).instructions.intro"></p>
              <div class="instruction-card" v-for="(item, ii) in content(c).instructions.items" :key="ii">
                <div class="instruction-icon">{{ item.icon }}</div>
                <div class="instruction-body">
                  <div class="instruction-title">{{ item.title }}</div>
                  <div class="instruction-text" v-html="item.body"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <footer class="footer">
      <span>Universal Agent Spec · v2.0</span>
      <span>github.com/your-handle/universal-agent-spec</span>
    </footer>
  </template>
</div>

<script>
const { createApp, ref, computed, onMounted } = Vue;

createApp({
  setup() {
    const lang      = ref('zh');   // default: 中文
    const loading   = ref(true);
    const chapters  = ref([]);
    const activeIdx = ref(0);
    const mainEl    = ref(null);
    const cardRefs  = ref([]);

    const LANGS     = window.AgentSpec.LANGS;
    const LANG_NAMES = window.AgentSpec.LANG_NAMES;

    // ── helpers ──
    const t = (field) => window.AgentSpec.t(field, lang.value);

    const content = (c) => {
      const ct = c.content || {};
      return ct[lang.value] || ct['en'] || {};
    };

    const buildSvg = (c) => {
      const vb = c.viewBox || '0 0 760 280';
      const parts = vb.split(' ');
      const w = parseInt(parts[2]);
      const h = parseInt(parts[3]);
      const pad = 40;
      const expandedVb = `0 0 ${w} ${h + pad * 2}`;
      const inner = c.getSvg ? c.getSvg(lang.value) : '';
      return `<svg viewBox="${expandedVb}" xmlns="http://www.w3.org/2000/svg"
        style="width:100%;height:auto;display:block;overflow:visible">
        <g transform="translate(0,${pad})">${inner}</g>
      </svg>`;
    };

    // ── language ──
    function setLang(l) {
      lang.value = l;
    }

    // ── navigation ──
    function scrollTo(i) {
      activeIdx.value = i;
      const el = cardRefs.value[i];
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function onScroll() {
      if (!mainEl.value) return;
      const top = mainEl.value.scrollTop + 80;
      for (let i = cardRefs.value.length - 1; i >= 0; i--) {
        const el = cardRefs.value[i];
        if (el && el.offsetTop <= top) { activeIdx.value = i; break; }
      }
    }

    // ── chapters are all inlined — just read synchronously ──
    onMounted(() => {
      chapters.value = window.AgentSpec.getChapters();
      loading.value = false;
    });

    return {
      lang, loading, chapters, activeIdx, mainEl, cardRefs,
      LANGS, LANG_NAMES,
      t, content, buildSvg, setLang, scrollTo, onScroll
    };
  }
}).mount('#app');
</script>
</body>
</html>
