<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal Agent Spec</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230071e3'/%3E%3Cpath d='M21 18h10l12 28H33z' fill='white'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.3.4/vue.global.prod.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* ── APPLE-STYLE DESIGN SYSTEM ── */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;700;900&display=swap');

  :root {
    --bg:          #f4f0e8;
    --bg2:         rgba(253,249,243,0.82);
    --bg3:         rgba(253,249,243,0.6);
    --surface:     #fdf9f3;
    --border:      rgba(0,0,0,0.12);
    --border2:     rgba(0,0,0,0.20);
    --blue:        #0071e3;
    --blue-light:  rgba(0,113,227,0.08);
    --blue-mid:    rgba(0,113,227,0.15);
    --amber:       #f59e0b;
    --amber-light: rgba(245,158,11,0.08);
    --green:       #34c759;
    --red:         #ff3b30;
    --purple:      #7c3aed;
    --text:        #1d1d1f;
    --text2:       #424245;
    --text3:       #6e6e73;
    --text4:       #a1a1a6;
    --shadow-sm:   0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:   0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
    --shadow-lg:   0 8px 32px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06);
    --radius:      14px;
    --radius-sm:   8px;
    --blur:        saturate(180%) blur(20px);
    --mono:        'JetBrains Mono', 'SF Mono', monospace;
    --sans:        'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    --serif:       'Noto Serif SC', serif;
  }

  html.dark {
    --bg: #0a0a0f;
    --bg2: #141420;
    --bg3: #1c1c2c;
    --surface: #1a1a2e;
    --border: rgba(255,255,255,0.1);
    --border2: rgba(255,255,255,0.18);
    --blue: #4d9fff;
    --blue-light: rgba(77,159,255,0.14);
    --blue-mid: rgba(77,159,255,0.22);
    --text: #e0e0e8;
    --text2: #b0b0c0;
    --text3: #707088;
    --text4: #505068;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* subtle dot grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, rgba(120,100,60,0.08) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
    z-index: 0;
  }

  html.dark body::before {
    background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
  }

  #app { position: relative; z-index: 1; }

  /* ── HEADER ── */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    background: rgba(244,240,232,0.88);
    border-bottom: 1px solid var(--border);
    padding: 18px 48px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .header-title {
    font-family: var(--sans);
    font-size: clamp(18px, 2.5vw, 26px);
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.03em;
    line-height: 1.1;
  }

  .header-title span { color: var(--blue); }

  .header-sub {
    font-size: 11px;
    color: var(--text3);
    margin-top: 3px;
    letter-spacing: 0.02em;
    font-family: var(--mono);
  }

  .header-badge {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--blue);
    background: rgba(0,113,227,0.06);
    border: 1px solid rgba(0,113,227,0.18);
    padding: 5px 12px;
    border-radius: 20px;
    white-space: nowrap;
    font-family: var(--sans);
  }

  .header-info { min-width: 0; }

  .header-controls {
    margin-left: auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    min-width: min(520px, 100%);
  }

  .header-tools {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    flex-wrap: wrap;
  }

  .search-wrap {
    width: min(520px, 100%);
    display: flex;
    justify-content: flex-end;
  }

  .search-input {
    width: min(320px, 100%);
    padding: 10px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-family: var(--sans);
    outline: none;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }

  .search-input::placeholder { color: var(--text4); }

  .search-input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px var(--blue-light);
  }

  .filter-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .filter-btn {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text3);
    transition: all 0.2s;
    white-space: nowrap;
  }

  .filter-btn:hover {
    color: var(--text);
    border-color: var(--border2);
    transform: translateY(-1px);
  }

  .filter-btn.active {
    color: var(--blue);
    border-color: rgba(0,113,227,0.3);
    background: var(--blue-light);
    box-shadow: var(--shadow-sm);
  }

  html.dark .header {
    background: rgba(10,10,15,0.82);
  }

  /* ── LANG TOGGLE ── */
  .lang-toggle {
    display: flex;
    gap: 3px;
    align-items: center;
    background: var(--border);
    border-radius: 10px;
    padding: 3px;
  }

  .lang-btn {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    padding: 5px 14px;
    border-radius: 8px;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--text3);
    transition: all 0.2s;
    white-space: nowrap;
  }

  .lang-btn:hover { color: var(--text); }

  .lang-btn.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow-sm);
  }

  /* ── LAYOUT ── */
  .layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: calc(100vh - 65px);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    border-right: 1px solid var(--border);
    padding: 24px 0;
    position: sticky;
    top: 65px;
    height: calc(100vh - 65px);
    overflow-y: auto;
    background: rgba(244,240,232,0.75);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
  }

  html.dark .sidebar {
    background: rgba(20,20,32,0.82);
  }

  .sidebar::-webkit-scrollbar { width: 3px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .sidebar-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--text4);
    text-transform: uppercase;
    padding: 0 18px 12px;
    font-family: var(--sans);
  }

  .sidebar-empty {
    padding: 0 18px;
    color: var(--text4);
    font-size: 12px;
    line-height: 1.7;
    font-family: var(--sans);
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    cursor: pointer;
    transition: all 0.15s;
    border-left: 2px solid transparent;
    font-size: 12px;
    font-weight: 400;
    color: var(--text3);
    font-family: var(--sans);
    border-radius: 0;
  }

  .nav-item:hover {
    color: var(--text);
    background: rgba(0,113,227,0.05);
  }

  .nav-item.active {
    color: var(--blue);
    border-left-color: var(--blue);
    background: rgba(0,113,227,0.06);
    font-weight: 500;
  }

  .nav-num { font-size: 10px; width: 18px; flex-shrink: 0; opacity: 0.45; font-family: var(--mono); }
  .nav-item.active .nav-num { opacity: 1; }

  /* ── MAIN ── */
  .main {
    padding: 40px 48px;
    max-width: 920px;
  }

  .empty-state {
    padding: 28px 30px;
    border-radius: var(--radius);
    border: 1px dashed var(--border2);
    background: var(--surface);
    color: var(--text3);
    font-size: 14px;
    line-height: 1.8;
    box-shadow: var(--shadow-sm);
  }

  /* ── CONCEPT CARD ── */
  .concept-card {
    background: var(--surface);
    border-radius: var(--radius);
    margin-bottom: 28px;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border);
    overflow: hidden;
    transition: box-shadow 0.2s, transform 0.2s;
  }

  .concept-card:hover {
    box-shadow: var(--shadow-lg);
    transform: translateY(-1px);
  }

  .card-header {
    padding: 24px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 16px;
    background: linear-gradient(135deg, #f5f0e6 0%, #fdf9f3 100%);
  }

  html.dark .card-header {
    background: linear-gradient(135deg, #202038 0%, #161622 100%);
  }

  .card-num {
    font-size: 40px;
    font-weight: 700;
    color: rgba(0,0,0,0.08);
    line-height: 1;
    flex-shrink: 0;
    font-family: var(--sans);
    letter-spacing: -0.03em;
  }

  html.dark .card-num { color: rgba(255,255,255,0.08); }

  .card-title-wrap { flex: 1; }

  .card-title {
    font-family: var(--sans);
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 3px;
    letter-spacing: -0.02em;
  }

  .card-title .accent { color: var(--blue); }

  .card-subtitle {
    font-size: 12px;
    color: var(--text3);
    font-family: var(--mono);
  }

  .card-tag {
    font-size: 10px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.05em;
    flex-shrink: 0;
    align-self: flex-start;
    margin-top: 2px;
    text-transform: uppercase;
    font-family: var(--sans);
  }

  .tag-infra   { background: rgba(124,58,237,0.08); color: var(--purple); border: 1px solid rgba(124,58,237,0.15); }
  .tag-core    { background: rgba(0,113,227,0.06); color: var(--blue); border: 1px solid rgba(0,113,227,0.15); }
  .tag-system  { background: var(--amber-light); color: var(--amber); border: 1px solid rgba(245,158,11,0.2); }
  .tag-pattern { background: rgba(52,199,89,0.08); color: #1a8a3a; border: 1px solid rgba(52,199,89,0.2); }
  .tag-biz     { background: rgba(255,59,48,0.07); color: var(--red); border: 1px solid rgba(255,59,48,0.15); }

  .card-body { padding: 28px; }

  .dual-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    padding: 28px;
  }

  .dual-col { min-width: 0; }

  .dual-col-head {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--text4);
    text-transform: uppercase;
    margin-bottom: 16px;
    font-family: var(--sans);
  }

  /* ── DIAGRAM ── */
  .diagram-wrap {
    background: #f0ebe0;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px 12px;
    margin-bottom: 24px;
    overflow: visible;
  }

  html.dark .diagram-wrap { background: #12121d; }

  .diagram-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }

  /* ── DEFINITION BLOCK ── */
  .def-block {
    border-left: 3px solid var(--blue);
    padding: 14px 18px;
    background: rgba(0,113,227,0.06);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    margin-bottom: 20px;
  }

  .def-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--blue);
    text-transform: uppercase;
    margin-bottom: 6px;
    font-family: var(--sans);
  }

  .def-text {
    font-size: 15px;
    line-height: 1.8;
    color: var(--text);
    font-family: var(--sans);
  }

  .def-text strong { color: var(--blue); font-weight: 600; }

  /* ── SECTIONS ── */
  .section { margin-bottom: 20px; }

  .section-title {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--sans);
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .prose {
    font-size: 15px;
    line-height: 1.9;
    color: var(--text2);
    font-family: var(--sans);
  }

  .prose strong { color: var(--text); font-weight: 600; }
  .prose em {
    color: var(--blue);
    font-style: normal;
    border-bottom: 1px dashed rgba(0,113,227,0.35);
  }

  /* ── CODE BLOCK ── */
  .code-block {
    background: #1c1c1e;
    border-radius: var(--radius-sm);
    padding: 16px 20px;
    font-size: 12px;
    line-height: 1.75;
    overflow-x: auto;
    margin: 14px 0;
    white-space: pre;
    color: #e2e8f0;
    font-family: var(--mono);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .code-block .kw  { color: #ff79c6; }
  .code-block .str { color: #f1fa8c; }
  .code-block .cmt { color: #6272a4; }
  .code-block .fn  { color: #50fa7b; }

  /* ── TABLE ── */
  .compare-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    margin: 12px 0;
    font-family: var(--sans);
  }

  .compare-table th {
    background: #ede8dc;
    color: var(--text3);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border2);
  }

  html.dark .compare-table th { background: #1d1d2f; }

  .compare-table td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text2);
    vertical-align: top;
    line-height: 1.5;
  }

  .compare-table tr:last-child td { border-bottom: none; }
  .compare-table tr:hover td { background: rgba(0,113,227,0.03); }

  /* ── INSIGHT BOX ── */
  .insight {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: rgba(245,158,11,0.06);
    border: 1px solid rgba(245,158,11,0.18);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin: 14px 0;
    font-size: 14px;
    line-height: 1.75;
    color: var(--text2);
    font-family: var(--sans);
  }

  html.dark .insight {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.08);
  }

  .insight strong { color: var(--text); }
  .insight-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }

  /* ── INSTRUCTION CARDS ── */
  .instruction-card {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: #f7f3ea;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px 18px;
    margin-bottom: 10px;
    transition: box-shadow 0.15s, background 0.15s;
  }

  html.dark .instruction-card { background: #161624; }

  .instruction-card:hover {
    background: var(--surface);
    box-shadow: var(--shadow-sm);
  }

  .instruction-icon { font-size: 20px; flex-shrink: 0; width: 32px; text-align: center; margin-top: 1px; }

  .instruction-body { flex: 1; }

  .instruction-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 5px;
    font-family: var(--sans);
  }

  .instruction-text {
    font-size: 13px;
    line-height: 1.85;
    color: var(--text2);
    font-family: var(--sans);
  }

  /* ── LOADING STATE ── */
  .loading-state {
    display: flex; align-items: center; justify-content: center;
    height: 60vh; flex-direction: column; gap: 16px;
    color: var(--text3); font-size: 13px; font-family: var(--sans);
  }

  .loading-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--blue); display: inline-block;
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50%       { opacity: 1;   transform: scale(1.2); }
  }

  /* ── FOOTER ── */
  .footer {
    border-top: 1px solid var(--border);
    padding: 20px 48px;
    font-size: 12px;
    color: var(--text4);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(244,240,232,0.85);
    font-family: var(--sans);
  }

  html.dark .footer { background: rgba(10,10,15,0.82); }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .main { padding: 24px 20px; }
    .header { padding: 14px 20px; flex-wrap: wrap; }
    .header-controls { width: 100%; min-width: 0; align-items: stretch; }
    .header-tools { justify-content: flex-start; }
    .search-wrap { width: 100%; justify-content: stretch; }
    .search-input { width: 100%; }
    .filter-group { justify-content: flex-start; }
    .dual-columns { grid-template-columns: 1fr; }
  }
</style>

<!-- ── INLINE: registry.js ── -->
<script>
(function () {
  const chapters = [];
  const registered = new Set();
  const AgentSpec = {
    register(chapter) {
      if (registered.has(chapter.id)) { console.warn('[AgentSpec] Duplicate id:', chapter.id); return; }
      chapters.push(chapter);
      registered.add(chapter.id);
    },
    getChapters() { return [...chapters].sort((a, b) => a.order - b.order); },
    t(field, lang) {
      if (typeof field === 'string') return field;
      return field[lang] || field['en'] || '';
    },
    LANGS: ['en', 'zh'],
    LANG_NAMES: { en: 'EN', zh: '中文' }
  };
  window.AgentSpec = AgentSpec;
})();
</script>

<!-- ── INLINE: helpers.js ── -->
<script src="core/helpers.js"></script>

<!-- ── DYNAMIC: manifest.js + chapter loaders ── -->
<script src="manifest.js"></script>
<script>
(function() {
  const manifest = window.AGENT_SPEC_MANIFEST;
  if (!manifest || !manifest.chapters) return;
  manifest.chapters.forEach(ch => {
    const s = document.createElement('script');
    s.src = ch.path;
    s.async = false;
    document.head.appendChild(s);
  });
})();
</script>
</head>
<body>

<!-- Global SVG marker defs -->
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <marker id="arr"  markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="var(--text2)"/></marker>
    <marker id="arrC" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0071e3"/></marker>
    <marker id="arrA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/></marker>
  </defs>
</svg>

<div id="app">
  <!-- LOADING -->
  <div v-if="loading" class="loading-state">
    <span class="loading-dot"></span>
    <span>{{ lang === 'zh' ? '加载章节中...' : 'Loading chapters...' }}</span>
  </div>

  <template v-else>
    <!-- HEADER -->
    <header class="header">
      <div class="header-info">
        <div class="header-title">
          <template v-if="lang === 'zh'">通用 <span>Agent</span> 定义规范</template>
          <template v-else>Universal <span>Agent</span> Spec</template>
        </div>
        <div class="header-sub">
          <template v-if="lang === 'zh'">Universal Agent Definition Specification · v2.0 · 工程实践向</template>
          <template v-else>Universal Agent Definition Specification · v2.0 · Engineering Reference</template>
        </div>
      </div>

      <div class="header-controls">
        <div class="search-wrap">
          <input
            v-model="searchQuery"
            class="search-input"
            type="search"
            :placeholder="lang === 'zh' ? '搜索章节标题或导航...' : 'Search titles or navigation...'"
          />
        </div>
        <div class="header-tools">
          <div class="filter-group">
            <button
              v-for="filter in FILTERS" :key="filter.value"
              class="filter-btn"
              :class="{ active: activeFilter === filter.value }"
              @click="setFilter(filter.value)"
            >{{ t(filter.label) }}</button>
          </div>
          <span class="header-badge">{{ visibleCountLabel }} {{ lang === 'zh' ? '核心概念' : 'Concepts' }}</span>
          <button
            class="filter-btn"
            :class="{ active: dualMode }"
            @click="toggleDualMode"
          >{{ lang === 'zh' ? '双栏' : 'Dual' }}</button>
          <button
            class="filter-btn"
            :class="{ active: isDark }"
            @click="toggleDark"
          >{{ isDark ? (lang === 'zh' ? '浅色' : 'Light') : (lang === 'zh' ? '深色' : 'Dark') }}</button>
          <div class="lang-toggle" style="margin-left:0">
            <button
              v-for="l in LANGS" :key="l"
              class="lang-btn"
              :class="{ active: lang === l }"
              @click="setLang(l)"
            >{{ LANG_NAMES[l] }}</button>
          </div>
        </div>
      </div>
    </header>

    <div class="layout">
      <!-- SIDEBAR -->
      <nav class="sidebar">
        <div class="sidebar-label">{{ lang === 'zh' ? '概念导航' : 'Contents' }}</div>
        <div
          v-for="c in filteredChapters"
          :key="c.id"
          class="nav-item"
          :class="{ active: activeId === c.id }"
          @click="scrollTo(c.id)"
        >
          <span class="nav-num">{{ String(c.order).padStart(2, '0') }}</span>
          <span>{{ t(c.nav) }}</span>
        </div>
        <div v-if="!filteredChapters.length" class="sidebar-empty">
          {{ lang === 'zh' ? '没有匹配的章节。' : 'No matching chapters.' }}
        </div>
      </nav>

      <!-- MAIN -->
      <main class="main" ref="mainEl" @scroll="onScroll">
        <div
          v-for="c in filteredChapters"
          :key="c.id"
          :ref="el => setCardRef(c.id, el)"
          class="concept-card"
        >
          <!-- CARD HEADER -->
          <div class="card-header">
            <div class="card-num">{{ String(c.order).padStart(2, '0') }}</div>
            <div class="card-title-wrap">
              <div class="card-title" v-html="t(c.title)"></div>
              <div class="card-subtitle">{{ t(c.subtitle) }}</div>
            </div>
            <span class="card-tag" :class="c.tagClass">{{ t(c.tag) }}</span>
          </div>

          <!-- CARD BODY -->
          <div v-if="dualMode" class="dual-columns">
            <div class="dual-col">
              <div class="dual-col-head">{{ columnLabel('zh') }}</div>

              <div class="diagram-wrap" v-if="c.getSvg" v-html="buildSvg(c, 'zh')"></div>

              <div class="def-block" v-if="contentFor(c, 'zh').definition">
                <div class="def-label">{{ sectionLabel('zh', 'definition') }}</div>
                <div class="def-text" v-html="contentFor(c, 'zh').definition"></div>
              </div>

              <div class="section" v-if="contentFor(c, 'zh').essence">
                <div class="section-title">{{ sectionLabel('zh', 'essence') }}</div>
                <div class="prose" v-html="contentFor(c, 'zh').essence"></div>
              </div>

              <div class="insight" v-if="contentFor(c, 'zh').insight">
                <span class="insight-icon">⚡</span>
                <span v-html="contentFor(c, 'zh').insight"></span>
              </div>

              <div v-if="contentFor(c, 'zh').code" class="code-block" v-html="contentFor(c, 'zh').code"></div>

              <div v-if="contentFor(c, 'zh').table" class="section">
                <div class="section-title">{{ contentFor(c, 'zh').table.title }}</div>
                <table class="compare-table">
                  <thead>
                    <tr><th v-for="h in contentFor(c, 'zh').table.headers" :key="h">{{ h }}</th></tr>
                  </thead>
                  <tbody>
                    <tr v-for="(row, ri) in contentFor(c, 'zh').table.rows" :key="ri">
                      <td v-for="(cell, ci) in row" :key="ci" v-html="cell"></td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <div v-if="contentFor(c, 'zh').tokenSaving" class="section">
                <div class="section-title">{{ contentFor(c, 'zh').tokenSaving.title }}</div>
                <table class="compare-table">
                  <thead>
                    <tr><th v-for="h in contentFor(c, 'zh').tokenSaving.headers" :key="h">{{ h }}</th></tr>
                  </thead>
                  <tbody>
                    <tr v-for="(row, ri) in contentFor(c, 'zh').tokenSaving.rows" :key="ri">
                      <td v-for="(cell, ci) in row" :key="ci" v-html="cell"></td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <div v-if="contentFor(c, 'zh').instructions" class="section">
                <div class="section-title">{{ contentFor(c, 'zh').instructions.title }}</div>
                <p class="prose" style="margin-bottom:16px" v-html="contentFor(c, 'zh').instructions.intro"></p>
                <div class="instruction-card" v-for="(item, ii) in contentFor(c, 'zh').instructions.items" :key="ii">
                  <div class="instruction-icon">{{ item.icon }}</div>
                  <div class="instruction-body">
                    <div class="instruction-title">{{ item.title }}</div>
                    <div class="instruction-text" v-html="item.body"></div>
                  </div>
                </div>
              </div>
            </div>

            <div class="dual-col">
              <div class="dual-col-head">{{ columnLabel('en') }}</div>

              <div class="diagram-wrap" v-if="c.getSvg" v-html="buildSvg(c, 'en')"></div>

              <div class="def-block" v-if="contentFor(c, 'en').definition">
                <div class="def-label">{{ sectionLabel('en', 'definition') }}</div>
                <div class="def-text" v-html="contentFor(c, 'en').definition"></div>
              </div>

              <div class="section" v-if="contentFor(c, 'en').essence">
                <div class="section-title">{{ sectionLabel('en', 'essence') }}</div>
                <div class="prose" v-html="contentFor(c, 'en').essence"></div>
              </div>

              <div class="insight" v-if="contentFor(c, 'en').insight">
                <span class="insight-icon">⚡</span>
                <span v-html="contentFor(c, 'en').insight"></span>
              </div>

              <div v-if="contentFor(c, 'en').code" class="code-block" v-html="contentFor(c, 'en').code"></div>

              <div v-if="contentFor(c, 'en').table" class="section">
                <div class="section-title">{{ contentFor(c, 'en').table.title }}</div>
                <table class="compare-table">
                  <thead>
                    <tr><th v-for="h in contentFor(c, 'en').table.headers" :key="h">{{ h }}</th></tr>
                  </thead>
                  <tbody>
                    <tr v-for="(row, ri) in contentFor(c, 'en').table.rows" :key="ri">
                      <td v-for="(cell, ci) in row" :key="ci" v-html="cell"></td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <div v-if="contentFor(c, 'en').tokenSaving" class="section">
                <div class="section-title">{{ contentFor(c, 'en').tokenSaving.title }}</div>
                <table class="compare-table">
                  <thead>
                    <tr><th v-for="h in contentFor(c, 'en').tokenSaving.headers" :key="h">{{ h }}</th></tr>
                  </thead>
                  <tbody>
                    <tr v-for="(row, ri) in contentFor(c, 'en').tokenSaving.rows" :key="ri">
                      <td v-for="(cell, ci) in row" :key="ci" v-html="cell"></td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <div v-if="contentFor(c, 'en').instructions" class="section">
                <div class="section-title">{{ contentFor(c, 'en').instructions.title }}</div>
                <p class="prose" style="margin-bottom:16px" v-html="contentFor(c, 'en').instructions.intro"></p>
                <div class="instruction-card" v-for="(item, ii) in contentFor(c, 'en').instructions.items" :key="ii">
                  <div class="instruction-icon">{{ item.icon }}</div>
                  <div class="instruction-body">
                    <div class="instruction-title">{{ item.title }}</div>
                    <div class="instruction-text" v-html="item.body"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div v-else class="card-body">
            <div class="diagram-wrap" v-if="c.getSvg" v-html="buildSvg(c)"></div>

            <div class="def-block" v-if="content(c).definition">
              <div class="def-label">{{ sectionLabel(lang, 'definition') }}</div>
              <div class="def-text" v-html="content(c).definition"></div>
            </div>

            <div class="section" v-if="content(c).essence">
              <div class="section-title">{{ sectionLabel(lang, 'essence') }}</div>
              <div class="prose" v-html="content(c).essence"></div>
            </div>

            <div class="insight" v-if="content(c).insight">
              <span class="insight-icon">⚡</span>
              <span v-html="content(c).insight"></span>
            </div>

            <div v-if="content(c).code" class="code-block" v-html="content(c).code"></div>

            <div v-if="content(c).table" class="section">
              <div class="section-title">{{ content(c).table.title }}</div>
              <table class="compare-table">
                <thead>
                  <tr><th v-for="h in content(c).table.headers" :key="h">{{ h }}</th></tr>
                </thead>
                <tbody>
                  <tr v-for="(row, ri) in content(c).table.rows" :key="ri">
                    <td v-for="(cell, ci) in row" :key="ci" v-html="cell"></td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div v-if="content(c).tokenSaving" class="section">
              <div class="section-title">{{ content(c).tokenSaving.title }}</div>
              <table class="compare-table">
                <thead>
                  <tr><th v-for="h in content(c).tokenSaving.headers" :key="h">{{ h }}</th></tr>
                </thead>
                <tbody>
                  <tr v-for="(row, ri) in content(c).tokenSaving.rows" :key="ri">
                    <td v-for="(cell, ci) in row" :key="ci" v-html="cell"></td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div v-if="content(c).instructions" class="section">
              <div class="section-title">{{ content(c).instructions.title }}</div>
              <p class="prose" style="margin-bottom:16px" v-html="content(c).instructions.intro"></p>
              <div class="instruction-card" v-for="(item, ii) in content(c).instructions.items" :key="ii">
                <div class="instruction-icon">{{ item.icon }}</div>
                <div class="instruction-body">
                  <div class="instruction-title">{{ item.title }}</div>
                  <div class="instruction-text" v-html="item.body"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div v-if="!filteredChapters.length" class="empty-state">
          {{ lang === 'zh'
            ? '没有找到符合当前搜索条件和标签筛选的章节，请调整关键词或过滤器。'
            : 'No chapters match the current search query and tag filter. Adjust the keyword or filter and try again.' }}
        </div>
      </main>
    </div>

    <footer class="footer">
      <span>Universal Agent Spec · v2.0</span>
      <span>github.com/your-handle/universal-agent-spec</span>
    </footer>
  </template>
</div>

<script>
const { createApp, ref, computed, onMounted, watch, nextTick } = Vue;

createApp({
  setup() {
    const lang      = ref('zh');   // default: 中文
    const loading   = ref(true);
    const chapters  = ref([]);
    const activeId  = ref('');
    const mainEl    = ref(null);
    const cardRefs  = ref({});
    const searchQuery = ref('');
    const activeFilter = ref('all');
    const dualMode = ref(false);
    const isDark = ref(localStorage.getItem('theme') === 'dark');

    const LANGS     = window.AgentSpec.LANGS;
    const LANG_NAMES = window.AgentSpec.LANG_NAMES;
    const FILTERS = [
      { value: 'all', label: { en: 'All', zh: '全部' } },
      { value: 'tag-infra', label: { en: 'Infra', zh: '基础设施' } },
      { value: 'tag-core', label: { en: 'Core', zh: '核心概念' } },
      { value: 'tag-system', label: { en: 'System', zh: '系统' } },
      { value: 'tag-pattern', label: { en: 'Pattern', zh: '模式' } },
      { value: 'tag-biz', label: { en: 'Business', zh: '商业' } }
    ];

    // ── helpers ──
    const t = (field) => window.AgentSpec.t(field, lang.value);

    const contentFor = (c, locale) => {
      const ct = c.content || {};
      return ct[locale] || ct['en'] || {};
    };

    const content = (c) => contentFor(c, lang.value);

    const SECTION_LABELS = {
      zh: { definition: '核心定义', essence: '本质解析' },
      en: { definition: 'Definition', essence: 'Essence' }
    };

    const sectionLabel = (locale, key) => {
      return SECTION_LABELS[locale]?.[key] || SECTION_LABELS.en[key] || '';
    };

    const columnLabel = (locale) => locale === 'zh' ? '中文' : 'English';

    const buildSvg = (c, locale = lang.value) => {
      const vb = c.viewBox || '0 0 760 280';
      const parts = vb.split(' ');
      const w = parseInt(parts[2]);
      const h = parseInt(parts[3]);
      const pad = 40;
      const expandedVb = `0 0 ${w} ${h + pad * 2}`;
      const inner = c.getSvg ? c.getSvg(locale) : '';
      return `<svg viewBox="${expandedVb}" xmlns="http://www.w3.org/2000/svg"
        style="width:100%;height:auto;display:block;overflow:visible">
        <g transform="translate(0,${pad})">${inner}</g>
      </svg>`;
    };

    const filteredChapters = computed(() => {
      let result = chapters.value;
      if (activeFilter.value !== 'all') {
        result = result.filter(c => c.tagClass === activeFilter.value);
      }
      if (searchQuery.value.trim()) {
        const q = searchQuery.value.toLowerCase();
        result = result.filter(c => {
          const nav = (c.nav?.en || '') + (c.nav?.zh || '');
          const title = (c.title?.en || '') + (c.title?.zh || '');
          return nav.toLowerCase().includes(q) || title.toLowerCase().includes(q);
        });
      }
      return result;
    });

    const visibleCountLabel = computed(() => {
      return filteredChapters.value.length === chapters.value.length
        ? String(chapters.value.length)
        : `${filteredChapters.value.length}/${chapters.value.length}`;
    });

    // ── language ──
    function setLang(l) {
      lang.value = l;
    }

    function setFilter(value) {
      activeFilter.value = value;
    }

    function toggleDualMode() {
      dualMode.value = !dualMode.value;
    }

    function toggleDark() {
      isDark.value = !isDark.value;
      localStorage.setItem('theme', isDark.value ? 'dark' : 'light');
      document.documentElement.classList.toggle('dark', isDark.value);
    }

    function setCardRef(id, el) {
      if (el) cardRefs.value[id] = el;
      else delete cardRefs.value[id];
    }

    // ── navigation ──
    function scrollTo(id) {
      activeId.value = id;
      const el = cardRefs.value[id];
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function onScroll() {
      if (!mainEl.value) return;
      const top = mainEl.value.scrollTop + 80;
      for (let i = filteredChapters.value.length - 1; i >= 0; i--) {
        const chapter = filteredChapters.value[i];
        const el = cardRefs.value[chapter.id];
        if (el && el.offsetTop <= top) {
          activeId.value = chapter.id;
          break;
        }
      }
    }

    function waitForChapters(timeoutMs = 5000) {
      const expected = window.AGENT_SPEC_MANIFEST?.chapters?.length || 0;
      const startedAt = Date.now();
      return new Promise(resolve => {
        const check = () => {
          const registered = window.AgentSpec.getChapters();
          const timedOut = Date.now() - startedAt >= timeoutMs;
          if (!expected || registered.length >= expected || timedOut) {
            resolve(registered);
            return;
          }
          window.setTimeout(check, 16);
        };
        check();
      });
    }

    watch(filteredChapters, async (list) => {
      if (!list.length) {
        activeId.value = '';
        return;
      }
      if (list.some(c => c.id === activeId.value)) return;
      activeId.value = list[0].id;
      await nextTick();
      if (mainEl.value) mainEl.value.scrollTo({ top: 0, behavior: 'smooth' });
    }, { immediate: true });

    // ── chapters are registered by manifest-driven script loaders ──
    onMounted(async () => {
      document.documentElement.classList.toggle('dark', isDark.value);
      chapters.value = await waitForChapters();
      loading.value = false;
    });

    return {
      lang, loading, chapters, activeId, mainEl, cardRefs,
      searchQuery, activeFilter, filteredChapters, visibleCountLabel, dualMode, isDark,
      LANGS, LANG_NAMES, FILTERS,
      t, content, contentFor, buildSvg, sectionLabel, columnLabel,
      setLang, setFilter, toggleDualMode, toggleDark, setCardRef, scrollTo, onScroll
    };
  }
}).mount('#app');
</script>
</body>
</html>
